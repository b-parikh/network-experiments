# CFDP Class 1 (unacknowledged): same link as cfdp-class2-leo. No retransmission, so with loss the
# receiver reports DATA_INCOMPLETE and the sha256 check fails. The run exits non-zero by design.
preset = "leo"

[downlink]
netem = "loss gemodel 0.5% 40%"

[app]
sender = "satellite"
file_size = "100M"
recv_cmd = "cfdp recv --local-id 2 --remote-id 1 --out-dir /data --once --class 1"
send_cmd = "cfdp send {file} {out} --local-id 1 --remote-id 2 --remote {peer}:4444 --class 1 --rate 150mbit"
timeout = 600
