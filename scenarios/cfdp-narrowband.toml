# CFDP Class 2 over 300 kbit/s down, 64 kbit/s up: NAKs and ACKs share the tiny uplink.
# Timers must exceed RTT plus serialization of a (possibly large) NAK on the uplink.
preset = "narrowband"

[app]
sender = "satellite"
file_size = "5M"
recv_cmd = "cfdp recv --local-id 2 --remote-id 1 --out-dir /data --once --class 2 --ack-interval 30 --ack-limit 5 --nak-interval 30 --nak-limit 5"
send_cmd = "cfdp send {file} {out} --local-id 1 --remote-id 2 --remote {peer}:4444 --class 2 --rate 250kbit --ack-interval 30 --ack-limit 5 --nak-interval 30 --nak-limit 5"
timeout = 1200
