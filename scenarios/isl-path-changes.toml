# File starts on a source satellite ("satellite" container), crosses ISLs to the main satellite,
# then downlinks to the ground station ("ground" container).
# Main-satellite switches change the ISL delay and the downlink together.
preset = "leo"

[isl]
delay = "5ms"

[[event]]
t = 60                                   # longer ISL path: delivery gap
switch = { isl_delay = "40ms", downlink = { delay = "22ms" } }

[[event]]
t = 120                                  # much shorter path: new packets overtake old ones (reordering)
switch = { isl_delay = "8ms", downlink = { delay = "28ms", rate = "150mbit" } }

[[event]]
t = 180                                  # switch with a 500 ms blackout
switch = { isl_delay = "25ms", downlink = { delay = "25ms", rate = "200mbit" }, gap_ms = 500 }

[app]
sender = "satellite"
recv_cmd = "iperf3 -s -1"
send_cmd = "iperf3 -c {peer} -t 240"
timeout = 400
