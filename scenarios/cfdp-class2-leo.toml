# CFDP Class 2 (acknowledged, NAK retransmission): 100 MiB over LEO with bursty loss.
# The sender is paced below the link rate; CFDP has no congestion control.
# The Python entity tops out around 200 Mbit/s of file data, so keep --rate at or below ~150mbit.
preset = "leo"

[downlink]
netem = "loss gemodel 0.5% 40%"

[app]
sender = "satellite"
file_size = "100M"
recv_cmd = "cfdp recv --local-id 2 --remote-id 1 --out-dir /data --once --class 2 --ack-interval 5 --nak-interval 5"
send_cmd = "cfdp send {file} {out} --local-id 1 --remote-id 2 --remote {peer}:4444 --class 2 --rate 150mbit --ack-interval 5 --nak-interval 5"
timeout = 600
